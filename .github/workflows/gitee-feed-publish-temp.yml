name: Publish Gitee feed (temporary)

on:
  workflow_dispatch:
    inputs:
      content_b64:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish appcast-gitee.xml
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          CONTENT_B64: ${{ inputs.content_b64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          token = os.environ['GITEE_TOKEN']
          content = base64.b64decode(os.environ['CONTENT_B64'])
          if not content.startswith(b'<?xml'):
              raise SystemExit('feed is not XML')
          api = 'https://gitee.com/api/v5/repos/lingyired/status-trio/contents/appcast-gitee.xml'
          headers = {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}
          def call(method, url, payload=None):
              request = urllib.request.Request(url, method=method, headers=headers,
                  data=json.dumps(payload).encode() if payload is not None else None)
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.loads(response.read())
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise
          current = call('GET', api)
          existing = current if isinstance(current, dict) and current.get('sha') else None
          payload = {'content': base64.b64encode(content).decode(), 'message': 'Publish Gitee appcast', 'branch': 'main'}
          if existing:
              payload['sha'] = existing['sha']
              call('PUT', api, payload)
          else:
              call('POST', api, payload)
          public = 'https://gitee.com/lingyired/status-trio/raw/main/appcast-gitee.xml'
          with urllib.request.urlopen(public) as response:
              body = response.read()
          if response.status != 200 or not body.startswith(b'<?xml'):
              raise SystemExit('public feed verification failed')
          print('published and verified appcast-gitee.xml')
          PY
