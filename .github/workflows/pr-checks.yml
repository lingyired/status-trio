            echo "Inspected Xcode installations:"
            sed 's/^/  /' "${CANDIDATES}"
            exit 1
          fi

          {
            echo "DEVELOPER_DIR=${SELECTED}"
            echo "SELECTED_XCODE=${SELECTED}"
            echo "SELECTED_MACOS_SDK=${SELECTED_SDK}"
            echo "SELECTED_SWIFT=${SELECTED_SWIFT}"
          } >> "${GITHUB_ENV}"
          echo "Selected ${SELECTED} (macOS SDK ${SELECTED_SDK}, Swift ${SELECTED_SWIFT})."

      - name: Install pinned XcodeGen 2.46.0
        shell: bash
        run: |
          set -euo pipefail
