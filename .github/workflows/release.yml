name: Build and Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, for example 1.2.0. Defaults to Support/Info.plist."
        required: false
        type: string
      build:
        description: "Numeric CFBundleVersion. Defaults to the GitHub run number for manual runs."
        required: false
        type: string
      tag:
        description: "Release tag. Defaults to vVERSION."
        required: false
        type: string
      publish:
        description: "Create a GitHub Release and publish appcast.xml."
        required: true
        default: false
        type: boolean
      notarize:
        description: "Require Developer ID signing and Apple notarization, including non-publishing test builds."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    environment:
      name: ${{ (github.event_name == 'push' || inputs.publish || inputs.notarize) && 'distribution' || 'ci' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_REPO: ${{ vars.RELEASE_REPO }}
      RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      NOTARIZE: ${{ inputs.notarize || false }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve release version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUILD_INPUT: ${{ inputs.build }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)"
          PLIST_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Support/Info.plist)"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            BUILD="${PLIST_BUILD}"

            if [[ "${VERSION}" != "${PLIST_VERSION}" ]]; then
              echo "::error::Tag ${TAG} does not match CFBundleShortVersionString ${PLIST_VERSION}."
              exit 1
            fi
          else
            VERSION="${VERSION_INPUT:-${PLIST_VERSION}}"
            BUILD="${BUILD_INPUT:-${GITHUB_RUN_NUMBER}}"
            TAG="${TAG_INPUT:-v${VERSION}}"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::VERSION must contain dot-separated numbers."
            exit 1
          fi

          if [[ ! "${BUILD}" =~ ^[0-9]+$ ]]; then
            echo "::error::BUILD must contain only digits."
            exit 1
          fi

          {
            echo "VERSION=${VERSION}"
            echo "BUILD=${BUILD}"
            echo "TAG=${TAG}"
          } >> "${GITHUB_ENV}"

          echo "Resolved release ${TAG}: ${VERSION} (${BUILD})"

      - name: Validate notarization test mode
        run: |
          set -euo pipefail
          if [[ "${NOTARIZE}" == "true" && "${PUBLISH}" == "true" ]]; then
            echo "::error::notarize=true requires publish=false; notarized CI test builds never publish releases or appcasts."
            exit 1
          fi

      - name: Validate appcast notes
        run: bash scripts/validate-appcast-notes.sh

      - name: Validate Sparkle signing secret
        if: ${{ env.PUBLISH == 'true' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_KEY}" ]]; then
            echo "::error::Set the SPARKLE_PRIVATE_KEY repository secret before publishing updates."
            exit 1
          fi

      - name: Configure Developer ID signing
        if: ${{ env.PUBLISH == 'true' || env.NOTARIZE == 'true' }}
        env:
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ "${NOTARIZE}" == "true" && -z "${DEVELOPER_ID_CERTIFICATE_P12}" ]]; then
            echo "::error::DEVELOPER_ID_CERTIFICATE_P12 is required when notarize=true."
            exit 1
          fi

          if [[ "${NOTARIZE}" == "true" && -z "${CERTIFICATE_PASSWORD}" ]]; then
            echo "::error::DEVELOPER_ID_CERTIFICATE_PASSWORD is required when notarize=true."
            exit 1
          fi

          if [[ "${PUBLISH}" != "true" && "${NOTARIZE}" != "true" ]] || [[ -z "${DEVELOPER_ID_CERTIFICATE_P12}" ]]; then
            echo "Developer ID signing is not configured; using Ad-hoc signing."
            exit 0
          fi

          if [[ -z "${CERTIFICATE_PASSWORD}" ]]; then
            echo "::error::DEVELOPER_ID_CERTIFICATE_PASSWORD is required when a certificate is provided."
            exit 1
          fi

          CERT_PATH="${RUNNER_TEMP}/developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          KEYCHAIN_LIST_BACKUP="${RUNNER_TEMP}/app-signing-keychains.original"
          KEYCHAIN_LIST_PARSED="${RUNNER_TEMP}/app-signing-keychains.parsed"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          SMOKE_PATH="${RUNNER_TEMP}/codesign-smoke"
          trap 'rm -f "${CERT_PATH:-}" "${SMOKE_PATH:-}" "${KEYCHAIN_LIST_PARSED:-}"' EXIT
          # The always-run cleanup step also handles partial keychain setup.
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

          security list-keychains -d user > "${KEYCHAIN_LIST_BACKUP}"
          ruby -rjson -e '
            File.foreach(ARGV[0]) { |line| STDOUT.write(JSON.parse(line), "\0") }
          ' "${KEYCHAIN_LIST_BACKUP}" > "${KEYCHAIN_LIST_PARSED}"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r -d '' keychain; do
            ORIGINAL_KEYCHAINS+=("${keychain}")
          done < "${KEYCHAIN_LIST_PARSED}"
          if [[ "${#ORIGINAL_KEYCHAINS[@]}" -eq 0 ]]; then
            echo "::error::Could not read the existing user keychain search list; refusing to replace it."
            exit 1
          fi
          echo "KEYCHAIN_LIST_BACKUP=${KEYCHAIN_LIST_BACKUP}" >> "${GITHUB_ENV}"

          printf '%s' "${DEVELOPER_ID_CERTIFICATE_P12}" | base64 -D > "${CERT_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" \
            -P "${CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          rm -f "${CERT_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}" >/dev/null

          IDENTITY="$(
            security find-identity -v -p codesigning "${KEYCHAIN_PATH}" \
              | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' \
              | head -n 1
          )"

          if [[ -z "${IDENTITY}" ]]; then
            echo "::error::No Developer ID Application identity was found in the imported certificate."
            exit 1
          fi

          security list-keychains -d user -s "${KEYCHAIN_PATH}" "${ORIGINAL_KEYCHAINS[@]}"

          cp /usr/bin/true "${SMOKE_PATH}"
          if ! /usr/bin/codesign --force --sign "${IDENTITY}" "${SMOKE_PATH}"; then
            echo "::error::Developer ID identity could not sign the disposable codesign smoke-test binary."
            exit 1
          fi
          if ! /usr/bin/codesign --verify --strict "${SMOKE_PATH}"; then
            echo "::error::Developer ID codesign smoke-test binary did not verify."
            exit 1
          fi
          rm -f "${SMOKE_PATH}"

          {
            echo "CODE_SIGN_IDENTITY=${IDENTITY}"
          } >> "${GITHUB_ENV}"

      - name: Configure Apple notarization
        if: ${{ env.PUBLISH == 'true' || env.NOTARIZE == 'true' }}
        env:
          NOTARY_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          NOTARY_API_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ "${NOTARIZE}" == "true" && -z "${NOTARY_API_PRIVATE_KEY}" ]]; then
            echo "::error::APPSTORE_CONNECT_API_PRIVATE_KEY is required when notarize=true."
            exit 1
          fi

          if [[ "${NOTARIZE}" == "true" && -z "${NOTARY_API_KEY_ID}" ]]; then
            echo "::error::APPSTORE_CONNECT_API_KEY_ID is required when notarize=true."
            exit 1
          fi

          if [[ "${NOTARIZE}" == "true" && -z "${NOTARY_API_ISSUER_ID}" ]]; then
            echo "::error::APPSTORE_CONNECT_API_ISSUER_ID is required when notarize=true."
            exit 1
          fi

          if [[ "${PUBLISH}" != "true" && "${NOTARIZE}" != "true" ]] || [[ -z "${NOTARY_API_PRIVATE_KEY}" ]]; then
            echo "Apple notarization is not configured."
            exit 0
          fi

          if [[ -z "${NOTARY_API_KEY_ID}" || -z "${NOTARY_API_ISSUER_ID}" ]]; then
            echo "::error::App Store Connect API key ID and issuer ID are required for notarization."
            exit 1
          fi

          KEY_PATH="${RUNNER_TEMP}/AuthKey_${NOTARY_API_KEY_ID}.p8"
          trap 'rm -f "${KEY_PATH:-}"' EXIT
          printf '%s' "${NOTARY_API_PRIVATE_KEY}" > "${KEY_PATH}"

          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            xcrun notarytool store-credentials "status-trio-notary" \
              --key "${KEY_PATH}" \
              --key-id "${NOTARY_API_KEY_ID}" \
              --issuer "${NOTARY_API_ISSUER_ID}" \
              --keychain "${KEYCHAIN_PATH}"
          else
            xcrun notarytool store-credentials "status-trio-notary" \
              --key "${KEY_PATH}" \
              --key-id "${NOTARY_API_KEY_ID}" \
              --issuer "${NOTARY_API_ISSUER_ID}"
          fi
          rm -f "${KEY_PATH}"

          echo "NOTARY_PROFILE=status-trio-notary" >> "${GITHUB_ENV}"

      - name: Prepare release notes
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          set -euo pipefail
          NOTES_DIR="${GITHUB_WORKSPACE}/release-notes/${VERSION}"
          RELEASE_BODY_PATH="${RUNNER_TEMP}/github-release-notes.md"

          for language in en zh-Hans; do
            if [[ ! -f "${NOTES_DIR}/${language}.md" ]]; then
              echo "::error::Release notes file does not exist: ${NOTES_DIR}/${language}.md"
              exit 1
            fi
          done

          # The body carries its own H1, so each language's '# <title>' line is
          # dropped; '## section' headings are preserved.
          {
            printf '# Version %s （English + 中文， 中文在下方）\n\n' "${VERSION}"
            printf '## English\n\n'
            grep -v '^# ' "${NOTES_DIR}/en.md"
            printf '\n## 中文\n\n'
            grep -v '^# ' "${NOTES_DIR}/zh-Hans.md"
          } > "${RELEASE_BODY_PATH}"

          {
            echo "RELEASE_NOTES_DIR=${NOTES_DIR}"
            echo "RELEASE_BODY_FILE=${RELEASE_BODY_PATH}"
          } >> "${GITHUB_ENV}"

      - name: Run tests
        run: |
          set +e
          swift test
          TEST_EXIT_CODE=$?
          set -e

          if [[ "${TEST_EXIT_CODE}" -ne 0 ]]; then
            echo "SwiftPM resource bundle diagnostics:"
            find .build -name 'StatusTrio_StatusTrioCore.bundle' -type d -print
            find .build -name 'StatusTrio_StatusTrioCore.bundle' -type d -exec find {} -maxdepth 4 -print \;
            find .build -name 'Localizable.strings' -print | head -n 50
          fi

          exit "${TEST_EXIT_CODE}"

      - name: Run native compatibility tests
        run: |
          set -euo pipefail
          bash scripts/test-macos13-deployment-contract-regressions.sh
          bash scripts/test-macos13-deployment-contract.sh
          bash scripts/test-appcast-minimum-system-version.sh
          bash scripts/test-macos13-bundle-contract.sh
          bash scripts/test-privileged-helper-bundle-contract.sh
          bash scripts/test-mobile-battery-helper.sh
          bash scripts/test-mobile-battery-rpaths.sh
          bash scripts/test-otool-dependencies.sh
          bash scripts/test-macos13-sparkle-contract.sh

      - name: Install mobile helper build tools
        run: brew install autoconf automake libtool pkg-config

      - name: Build, sign, notarize, and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ env.PUBLISH == 'true' && secrets.SPARKLE_PRIVATE_KEY || '' }}
        run: bash scripts/release.sh

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StatusTrio-${{ github.run_number }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/release.env
          if-no-files-found: ignore

      - name: Clean up signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: |
          set -euo pipefail
          CLEANUP_STATUS=0
          if [[ -n "${KEYCHAIN_LIST_BACKUP:-}" && -f "${KEYCHAIN_LIST_BACKUP}" ]]; then
            KEYCHAIN_LIST_PARSED="${RUNNER_TEMP}/app-signing-keychains.restore"
            if ruby -rjson -e '
              File.foreach(ARGV[0]) { |line| STDOUT.write(JSON.parse(line), "\0") }
            ' "${KEYCHAIN_LIST_BACKUP}" > "${KEYCHAIN_LIST_PARSED}"; then
              ORIGINAL_KEYCHAINS=()
              while IFS= read -r -d '' keychain; do
                ORIGINAL_KEYCHAINS+=("${keychain}")
              done < "${KEYCHAIN_LIST_PARSED}"
              if [[ "${#ORIGINAL_KEYCHAINS[@]}" -gt 0 ]] && security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}"; then
                rm -f "${KEYCHAIN_LIST_BACKUP}"
              else
                echo "::error::Could not restore the original user keychain search list."
                CLEANUP_STATUS=1
              fi
            else
              echo "::error::Could not parse the saved user keychain search list."
              CLEANUP_STATUS=1
            fi
            rm -f "${KEYCHAIN_LIST_PARSED}"
          fi
          if [[ -n "${KEYCHAIN_PATH}" && -f "${KEYCHAIN_PATH}" ]]; then
            if ! security delete-keychain "${KEYCHAIN_PATH}"; then
              echo "::error::Could not delete the temporary signing keychain."
              CLEANUP_STATUS=1
            fi
          fi
          exit "${CLEANUP_STATUS}"
