name: Build and Release macOS

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Frozen 40-character commit SHA to verify and publish."
        required: true
        type: string
      version:
        description: "Marketing version. Defaults to Support/Info.plist."
        required: false
        type: string
      build:
        description: "Numeric CFBundleVersion. Defaults to the workflow run number."
        required: false
        type: string
      tag:
        description: "Release tag. Defaults to vVERSION."
        required: false
        type: string
      publish:
        description: "Publish the frozen package. Leave off for a diagnostic package."
        required: true
        default: false
        type: boolean
      notarize:
        description: "Require Developer ID signing and notarization. Valid with publish=false too."
        required: true
        default: false
        type: boolean
      package_run_id:
        description: "Recover publication from the verified package artifact of this earlier run. Requires publish=true and notarize=true."
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: status-trio-release-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 45
    outputs:
      candidate_sha: ${{ steps.release.outputs.candidate_sha }}
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
      tag: ${{ steps.release.outputs.tag }}
      recovery_source_run_id: ${{ steps.recovery.outputs.source_run_id }}
      recovery_artifact_id: ${{ steps.recovery.outputs.artifact_id }}
      recovery_artifact_digest: ${{ steps.recovery.outputs.artifact_digest }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
      PUBLISH_MODE: ${{ inputs.publish }}
      NOTARIZE_INPUT: ${{ inputs.notarize }}
      VERSION_INPUT: ${{ inputs.version }}
      BUILD_INPUT: ${{ inputs.build }}
      TAG_INPUT: ${{ inputs.tag }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      CI_TOOLS_ROOT: ${{ inputs.package_run_id != '' && format('{0}/release-tools', github.workspace) || github.workspace }}
      CI_LOG_DIR: ${{ github.workspace }}/.build/ci-logs

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha }}

      - name: Show toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version
          printf 'macOS SDK: %s\n' "$(xcrun --sdk macosx --show-sdk-version)"

      - name: Validate frozen candidate and resolve release
        id: release
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::release.yml must be dispatched from main, not ${GITHUB_REF}."
            exit 1
          fi
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a lowercase 40-character commit SHA."
            exit 1
          fi
          if [[ -n "${PACKAGE_RUN_ID}" ]]; then
            if [[ "${PUBLISH_MODE}" != "true" || "${NOTARIZE_INPUT}" != "true" ]]; then
              echo "::error::package_run_id recovery requires publish=true and notarize=true."
              exit 1
            fi
            if [[ -z "${VERSION_INPUT}" || -z "${BUILD_INPUT}" || -z "${TAG_INPUT}" ]]; then
              echo "::error::package_run_id recovery requires explicit version, build, and tag."
              exit 1
            fi
            if [[ ! "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Recovery requires a full github.workflow_sha."
              exit 1
            fi
          fi

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [[ "${CHECKED_OUT_SHA}" != "${CANDIDATE_SHA}" ]]; then
            echo "::error::Checked-out ${CHECKED_OUT_SHA} does not equal frozen candidate ${CANDIDATE_SHA}."
            exit 1
          fi

          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${CANDIDATE_SHA}" origin/main; then
            echo "::error::Candidate ${CANDIDATE_SHA} is not part of origin/main."
            exit 1
          fi

          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)"
          VERSION="${VERSION_INPUT:-${PLIST_VERSION}}"
          BUILD="${BUILD_INPUT:-${GITHUB_RUN_NUMBER}}"
          TAG="${TAG_INPUT:-v${VERSION}}"

          [[ "${VERSION}" =~ ^[0-9]+(\.[0-9]+)*$ ]] ||
            { echo "::error::VERSION must contain dot-separated numbers."; exit 1; }
          [[ "${BUILD}" =~ ^[0-9]+$ ]] ||
            { echo "::error::BUILD must contain only digits."; exit 1; }
          [[ "${TAG}" == "v${VERSION}" ]] ||
            { echo "::error::TAG must equal vVERSION."; exit 1; }

          {
            echo "CANDIDATE_SHA=${CANDIDATE_SHA}"
            echo "VERSION=${VERSION}"
            echo "BUILD=${BUILD}"
            echo "TAG=${TAG}"
          } >> "${GITHUB_ENV}"
          {
            echo "candidate_sha=${CANDIDATE_SHA}"
            echo "version=${VERSION}"
            echo "build=${BUILD}"
            echo "tag=${TAG}"
          } >> "${GITHUB_OUTPUT}"

          echo "Resolved ${TAG}: ${VERSION} (${BUILD}) at ${CANDIDATE_SHA}"

      - name: Check out trusted release recovery tooling
        if: ${{ inputs.package_run_id != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.workflow_sha }}
          path: release-tools

      - name: Validate frozen package source run
        if: ${{ inputs.package_run_id != '' }}
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.package_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_BUILD: ${{ steps.release.outputs.build }}
          EXPECTED_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ACTUAL_TOOLING_SHA="$(git -C release-tools rev-parse HEAD)"
          [[ "${ACTUAL_TOOLING_SHA}" == "${WORKFLOW_SHA}" ]] || {
            echo "::error::Trusted tooling checkout ${ACTUAL_TOOLING_SHA} differs from ${WORKFLOW_SHA}."
            exit 1
          }
          bash release-tools/scripts/validate-release-recovery.sh

      - name: Run static release preflight
        run: |
          bash "$CI_TOOLS_ROOT/scripts/ci-run-stage.sh" preflight bash -euo pipefail <<'PREFLIGHT'
          for script in scripts/*.sh; do bash -n "$script"; done
          bash scripts/check-forbidden-patterns.sh
          bash "$CI_TOOLS_ROOT/scripts/check-release-workflow-policy.sh"
          bash "$CI_TOOLS_ROOT/scripts/test-release-workflow-policy.sh"
          bash "$CI_TOOLS_ROOT/scripts/test-ci-workflow.sh"
          if [[ "${PUBLISH_MODE}" == "true" ]]; then
            VERSION="$VERSION" BUILD="$BUILD" PUBLISH=true NOTES_MODE=publish \
              RELEASE_NOTES_DIR="$GITHUB_WORKSPACE/release-notes/$VERSION" \
              bash scripts/validate-appcast-notes.sh
          else
            VERSION="$VERSION" BUILD="$BUILD" PUBLISH=false NOTES_MODE=package \
              RELEASE_NOTES_DIR="$GITHUB_WORKSPACE/release-notes/$VERSION" \
              bash scripts/validate-appcast-notes.sh
          fi
          PREFLIGHT

      - name: Run tests
        run: bash "$CI_TOOLS_ROOT/scripts/ci-run-stage.sh" tests bash scripts/test.sh

      - name: Run trusted release recovery regressions
        if: ${{ inputs.package_run_id != '' }}
        run: |
          set -euo pipefail
          bash release-tools/scripts/test-release-recovery.sh
          bash release-tools/scripts/test-release-pipeline.sh

      - name: Summarize verify diagnostics
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -f "$CI_TOOLS_ROOT/scripts/ci-diagnostics.py" ]]; then
            python3 "$CI_TOOLS_ROOT/scripts/ci-diagnostics.py" summary "$CI_LOG_DIR"
          else
            echo 'Verify stopped before diagnostic tooling was available. See the first failed step.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verify diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-diagnostics
          path: .build/ci-logs/
          if-no-files-found: ignore
          retention-days: 14

  native:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      CI_TOOLS_ROOT: ${{ inputs.package_run_id != '' && format('{0}/release-tools', github.workspace) || github.workspace }}
      CI_LOG_DIR: ${{ github.workspace }}/.build/ci-logs

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha }}

      - name: Reassert frozen candidate
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "${ACTUAL_SHA}" == "${CANDIDATE_SHA}" ]] || {
            echo "::error::Native checkout ${ACTUAL_SHA} differs from ${CANDIDATE_SHA}."
            exit 1
          }
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${CANDIDATE_SHA}" origin/main; then
            echo "::error::Native candidate ${CANDIDATE_SHA} is not part of origin/main."
            exit 1
          fi
          swift --version
          xcodebuild -version
          printf 'macOS SDK: %s\n' "$(xcrun --sdk macosx --show-sdk-version)"

      - name: Check out trusted release recovery tooling
        if: ${{ inputs.package_run_id != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.workflow_sha }}
          path: release-tools

      - name: Verify trusted release recovery tooling
        if: ${{ inputs.package_run_id != '' }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git -C release-tools rev-parse HEAD)"
          [[ "${ACTUAL_SHA}" == "${WORKFLOW_SHA}" ]] || {
            echo "::error::Trusted native tooling ${ACTUAL_SHA} differs from ${WORKFLOW_SHA}."
            exit 1
          }

      - name: Run native and release-contract tests
        run: |
          bash "$CI_TOOLS_ROOT/scripts/ci-run-stage.sh" native bash -euo pipefail <<'NATIVE'
          bash scripts/test-macos13-deployment-contract-regressions.sh
          bash scripts/test-macos13-deployment-contract.sh
          bash scripts/test-appcast-minimum-system-version.sh
          bash scripts/test-macos13-bundle-contract.sh
          bash scripts/test-privileged-helper-bundle-contract.sh
          bash scripts/test-mobile-battery-helper.sh
          bash scripts/test-mobile-battery-rpaths.sh
          bash scripts/test-otool-dependencies.sh
          bash scripts/test-macos13-sparkle-contract.sh
          bash scripts/test-mobile-battery-source-cache.sh
          bash "$CI_TOOLS_ROOT/scripts/test-mobile-battery-build-cache.sh"
          bash "$CI_TOOLS_ROOT/scripts/test-ci-diagnostics.sh"
          bash "$CI_TOOLS_ROOT/scripts/test-build-timing.sh"
          bash scripts/test-release-pipeline.sh
          bash scripts/test-release-notarization.sh
          bash scripts/test-dmg-installer.sh
          bash scripts/test-mobile-battery-clang-version.sh
          bash scripts/test-verify-local.sh
          bash scripts/test-verify-local-bundle.sh
          bash scripts/test-workflow-policy.sh
          NATIVE

      - name: Summarize native diagnostics
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CI_DIAGNOSTIC_JOB: native
        run: |
          if [[ -f "$CI_TOOLS_ROOT/scripts/ci-diagnostics.py" ]]; then
            python3 "$CI_TOOLS_ROOT/scripts/ci-diagnostics.py" summary "$CI_LOG_DIR"
          else
            echo 'Native verification stopped before diagnostic tooling was available. See the first failed step.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-diagnostics
          path: .build/ci-logs/
          if-no-files-found: ignore
          retention-days: 14

  package:
    needs: [verify, native]
    runs-on: xcode-27
    if: ${{ inputs.package_run_id == '' }}
    timeout-minutes: 75
    environment:
      name: ${{ (inputs.publish || github.triggering_actor != 'lingyired') && 'distribution' || 'distribution-owner-signing' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha || inputs.candidate_sha }}
      VERSION: ${{ needs.verify.outputs.version }}
      BUILD: ${{ needs.verify.outputs.build }}
      TAG: ${{ needs.verify.outputs.tag }}
      PUBLISH_MODE: ${{ inputs.publish }}
      NOTARIZE: ${{ inputs.notarize }}
      RESOLVED_RELEASE_REPO: ${{ vars.RELEASE_REPO || 'lingyired/status-trio' }}
      RESOLVED_RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH || 'main' }}
      BUILD_TIMING_FILE: ${{ github.workspace }}/.build/ci-logs/package-build-timings.tsv

    steps:
      - name: Check out the frozen candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha }}

      - name: Reassert frozen candidate
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "${ACTUAL_SHA}" == "${CANDIDATE_SHA}" ]] || {
            echo "::error::package checkout ${ACTUAL_SHA} differs from ${CANDIDATE_SHA}."
            exit 1
          }
          swift --version
          xcodebuild -version
          printf 'macOS SDK: %s\n' "$(xcrun --sdk macosx --show-sdk-version)"

      - name: Prepare DMG installer tool
        run: |
          if ! command -v create-dmg >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install create-dmg
          fi
          bash scripts/create-installer-dmg.sh --check

      - name: Validate publishing secrets and notarization mode
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          NOTARY_API_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH_MODE}" == "true" && -z "${SPARKLE_PRIVATE_KEY}" ]]; then
            echo "::error::SPARKLE_PRIVATE_KEY is required to publish."
            exit 1
          fi
          if [[ "${NOTARIZE}" == "true" ]]; then
            for pair in \
              "DEVELOPER_ID_CERTIFICATE_P12:${DEVELOPER_ID_CERTIFICATE_P12:-}" \
              "CERTIFICATE_PASSWORD:${CERTIFICATE_PASSWORD:-}" \
              "NOTARY_API_KEY_ID:${NOTARY_API_KEY_ID:-}" \
              "NOTARY_API_ISSUER_ID:${NOTARY_API_ISSUER_ID:-}" \
              "NOTARY_API_PRIVATE_KEY:${NOTARY_API_PRIVATE_KEY:-}"; do
              [[ -n "${pair#*:}" ]] || {
                echo "::error::notarize=true requires ${pair%%:*}."
                exit 1
              }
            done
          fi

      - name: Configure Developer ID signing
        if: ${{ inputs.publish || inputs.notarize }}
        env:
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${DEVELOPER_ID_CERTIFICATE_P12}" ]]; then
            if [[ "${NOTARIZE}" == "true" ]]; then
              echo "::error::DEVELOPER_ID_CERTIFICATE_P12 is required when notarize=true."
              exit 1
            fi
            echo "Developer ID signing is not configured; package will be Ad-hoc signed."
            exit 0
          fi
          [[ -n "${CERTIFICATE_PASSWORD:-}" ]] || {
            echo "::error::DEVELOPER_ID_CERTIFICATE_PASSWORD is required with a certificate."
            exit 1
          }

          CERT_PATH="${RUNNER_TEMP}/developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          KEYCHAIN_LIST_BACKUP="${RUNNER_TEMP}/app-signing-keychains.original"
          KEYCHAIN_LIST_PARSED="${RUNNER_TEMP}/app-signing-keychains.parsed"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          SMOKE_PATH="${RUNNER_TEMP}/codesign-smoke"
          trap 'rm -f "${CERT_PATH:-}" "${SMOKE_PATH:-}" "${KEYCHAIN_LIST_PARSED:-}"' EXIT
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

          security list-keychains -d user > "${KEYCHAIN_LIST_BACKUP}"
          ruby -rjson -e '
            File.foreach(ARGV[0]) { |line| STDOUT.write(JSON.parse(line), "\0") }
          ' "${KEYCHAIN_LIST_BACKUP}" > "${KEYCHAIN_LIST_PARSED}"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r -d '' keychain; do
            ORIGINAL_KEYCHAINS+=("${keychain}")
          done < "${KEYCHAIN_LIST_PARSED}"
          [[ "${#ORIGINAL_KEYCHAINS[@]}" -gt 0 ]] || {
            echo "::error::Could not read the existing user keychain search list."
            exit 1
          }
          echo "KEYCHAIN_LIST_BACKUP=${KEYCHAIN_LIST_BACKUP}" >> "${GITHUB_ENV}"

          printf '%s' "${DEVELOPER_ID_CERTIFICATE_P12}" | base64 -D > "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          rm -f "${CERT_PATH}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}" >/dev/null
          IDENTITY="$(
            security find-identity -v -p codesigning "${KEYCHAIN_PATH}" |
              sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' |
              head -n 1
          )"
          [[ -n "${IDENTITY}" ]] || {
            echo "::error::No Developer ID Application identity was found."
            exit 1
          }
          security list-keychains -d user -s "${KEYCHAIN_PATH}" "${ORIGINAL_KEYCHAINS[@]}"
          cp /usr/bin/true "${SMOKE_PATH}"
          if ! /usr/bin/codesign --force --sign "${IDENTITY}" "${SMOKE_PATH}"; then
            echo "::error::Developer ID identity could not sign the disposable codesign smoke-test binary."
            exit 1
          fi
          if ! /usr/bin/codesign --verify --strict "${SMOKE_PATH}"; then
            echo "::error::Developer ID codesign smoke-test binary did not verify."
            exit 1
          fi
          rm -f "${SMOKE_PATH}"
          echo "CODE_SIGN_IDENTITY=${IDENTITY}" >> "${GITHUB_ENV}"

      - name: Configure Apple notarization
        if: ${{ inputs.publish || inputs.notarize }}
        env:
          NOTARY_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          NOTARY_API_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${NOTARY_API_PRIVATE_KEY}" ]]; then
            if [[ "${NOTARIZE}" == "true" ]]; then
              echo "::error::APPSTORE_CONNECT_API_PRIVATE_KEY is required when notarize=true."
              exit 1
            fi
            echo "Apple notarization is not configured."
            exit 0
          fi
          [[ -n "${NOTARY_API_KEY_ID}" && -n "${NOTARY_API_ISSUER_ID}" ]] || {
            echo "::error::App Store Connect API key ID and issuer ID are required."
            exit 1
          }
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${NOTARY_API_KEY_ID}.p8"
          trap 'rm -f "${KEY_PATH:-}"' EXIT
          printf '%s' "${NOTARY_API_PRIVATE_KEY}" > "${KEY_PATH}"
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            xcrun notarytool store-credentials status-trio-notary \
              --key "${KEY_PATH}" --key-id "${NOTARY_API_KEY_ID}" \
              --issuer "${NOTARY_API_ISSUER_ID}" --keychain "${KEYCHAIN_PATH}"
          else
            xcrun notarytool store-credentials status-trio-notary \
              --key "${KEY_PATH}" --key-id "${NOTARY_API_KEY_ID}" \
              --issuer "${NOTARY_API_ISSUER_ID}"
          fi
          rm -f "${KEY_PATH}"
          echo "NOTARY_PROFILE=status-trio-notary" >> "${GITHUB_ENV}"

      - name: Install mobile helper build tools
        run: brew install autoconf automake libtool pkg-config

      - name: Resolve exact native dependency cache keys
        id: native-cache-keys
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$BUILD_TIMING_FILE")"
          python3 scripts/mobile-battery-cache.py prepare-key \
            --root "$GITHUB_WORKSPACE" --arch arm64 --minimum-macos 13.0 \
            --github-output "$GITHUB_OUTPUT" --output-name key_arm64
          python3 scripts/mobile-battery-cache.py prepare-key \
            --root "$GITHUB_WORKSPACE" --arch x86_64 --minimum-macos 13.0 \
            --github-output "$GITHUB_OUTPUT" --output-name key_x86_64
          echo "CACHE_RESTORE_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Restore arm64 native dependencies
        id: native-cache-arm64
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.native-cache-keys.outputs.key_arm64 }}
          path: |
            .build/mobile-battery/arm64/prefix
            .build/mobile-battery/arm64/.dependencies-cache.json

      - name: Restore x86_64 native dependencies
        id: native-cache-x86_64
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.native-cache-keys.outputs.key_x86_64 }}
          path: |
            .build/mobile-battery/x86_64/prefix
            .build/mobile-battery/x86_64/.dependencies-cache.json

      - name: Record native cache restore
        env:
          ARM64_RESTORED_KEY: ${{ steps.native-cache-arm64.outputs.cache-matched-key }}
          X86_64_RESTORED_KEY: ${{ steps.native-cache-x86_64.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          printf 'native-cache-restore\t%s\t0\n' \
            "$(( $(date +%s) - CACHE_RESTORE_STARTED ))" >> "$BUILD_TIMING_FILE"
          printf 'Cache restored: arm64=%s x86_64=%s\n' \
            "${ARM64_RESTORED_KEY:-miss}" "${X86_64_RESTORED_KEY:-miss}"
          echo "Restored prefixes are validated by the build script before reuse."
          for arch in arm64 x86_64; do
            if [[ -d ".build/mobile-battery/$arch/prefix" ]]; then
              du -sk ".build/mobile-battery/$arch/prefix"
            fi
          done

      - name: Build, sign, notarize, and package once
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SOURCE_SHA: ${{ inputs.candidate_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          BUILD: ${{ needs.verify.outputs.build }}
          TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_REPO: ${{ env.RESOLVED_RELEASE_REPO }}
          RELEASE_BRANCH: ${{ env.RESOLVED_RELEASE_BRANCH }}
          OUTPUT_DIR: ${{ github.workspace }}/dist/release-package
          RELEASE_NOTES_DIR: release-notes/${{ needs.verify.outputs.version }}
        run: bash scripts/package-release.sh

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: status-trio-release-package
          path: dist/release-package/
          if-no-files-found: error
          retention-days: 30

      - name: Validate native dependency caches before saving
        env:
          ARM64_KEY: ${{ steps.native-cache-keys.outputs.key_arm64 }}
          X86_64_KEY: ${{ steps.native-cache-keys.outputs.key_x86_64 }}
        run: |
          set -euo pipefail
          python3 scripts/mobile-battery-cache.py validate \
            --root "$GITHUB_WORKSPACE" --arch arm64 --minimum-macos 13.0 \
            --expected-key "$ARM64_KEY"
          python3 scripts/mobile-battery-cache.py validate \
            --root "$GITHUB_WORKSPACE" --arch x86_64 --minimum-macos 13.0 \
            --expected-key "$X86_64_KEY"
          echo "CACHE_SAVE_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Save arm64 native dependencies
        if: github.ref == 'refs/heads/main' && steps.native-cache-arm64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.native-cache-keys.outputs.key_arm64 }}
          path: |
            .build/mobile-battery/arm64/prefix
            .build/mobile-battery/arm64/.dependencies-cache.json

      - name: Save x86_64 native dependencies
        if: github.ref == 'refs/heads/main' && steps.native-cache-x86_64.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.native-cache-keys.outputs.key_x86_64 }}
          path: |
            .build/mobile-battery/x86_64/prefix
            .build/mobile-battery/x86_64/.dependencies-cache.json

      - name: Record native cache save
        run: |
          set -euo pipefail
          printf 'native-cache-save\t%s\t0\n' \
            "$(( $(date +%s) - CACHE_SAVE_STARTED ))" >> "$BUILD_TIMING_FILE"

      - name: Summarize package diagnostics
        if: always()
        run: python3 scripts/ci-diagnostics.py timings "$BUILD_TIMING_FILE"

      - name: Upload package build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-build-timings
          path: ${{ env.BUILD_TIMING_FILE }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean up signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: |
          set -euo pipefail
          CLEANUP_STATUS=0
          if [[ -n "${KEYCHAIN_LIST_BACKUP:-}" && -f "${KEYCHAIN_LIST_BACKUP}" ]]; then
            KEYCHAIN_LIST_PARSED="${RUNNER_TEMP}/app-signing-keychains.restore"
            if ruby -rjson -e '
              File.foreach(ARGV[0]) { |line| STDOUT.write(JSON.parse(line), "\0") }
            ' "${KEYCHAIN_LIST_BACKUP}" > "${KEYCHAIN_LIST_PARSED}"; then
              ORIGINAL_KEYCHAINS=()
              while IFS= read -r -d '' keychain; do
                ORIGINAL_KEYCHAINS+=("${keychain}")
              done < "${KEYCHAIN_LIST_PARSED}"
              if [[ "${#ORIGINAL_KEYCHAINS[@]}" -gt 0 ]] &&
                security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}"; then
                rm -f "${KEYCHAIN_LIST_BACKUP}"
              else
                echo "::error::Could not restore the original user keychain search list."
                CLEANUP_STATUS=1
              fi
            else
              echo "::error::Could not parse the saved user keychain search list."
              CLEANUP_STATUS=1
            fi
            rm -f "${KEYCHAIN_LIST_PARSED}"
          fi
          if [[ -n "${KEYCHAIN_PATH}" && -f "${KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${KEYCHAIN_PATH}" || {
              echo "::error::Could not delete the temporary signing keychain."
              CLEANUP_STATUS=1
            }
          fi
          exit "${CLEANUP_STATUS}"

  publish:
    if: ${{ !cancelled() && inputs.publish && needs.verify.result == 'success' && needs.native.result == 'success' && (inputs.package_run_id != '' || needs.package.result == 'success') }}
    needs: [verify, native, package]
    runs-on: xcode-27
    timeout-minutes: 30
    environment:
      name: distribution
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha || inputs.candidate_sha }}
      PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
      RECOVERY_SOURCE_RUN_ID: ${{ needs.verify.outputs.recovery_source_run_id }}
      RECOVERY_ARTIFACT_ID: ${{ needs.verify.outputs.recovery_artifact_id }}
      RECOVERY_ARTIFACT_DIGEST: ${{ needs.verify.outputs.recovery_artifact_digest }}
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer

    steps:
      - name: Check out the frozen candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha }}

      - name: Check out trusted publish tooling
        if: ${{ inputs.package_run_id != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.workflow_sha }}
          path: release-tools

      - name: Verify trusted publish tooling
        if: ${{ inputs.package_run_id != '' }}
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          ACTUAL_TOOLING_SHA="$(git -C release-tools rev-parse HEAD)"
          [[ "${ACTUAL_TOOLING_SHA}" == "${WORKFLOW_SHA}" ]] || {
            echo "::error::Trusted publish tooling ${ACTUAL_TOOLING_SHA} differs from ${WORKFLOW_SHA}."
            exit 1
          }

      - name: Download the verified package
        uses: actions/download-artifact@v4
        with:
          name: status-trio-release-package
          path: dist/release-package
          run-id: ${{ needs.verify.outputs.recovery_source_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Reassert frozen candidate
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "${ACTUAL_SHA}" == "${CANDIDATE_SHA}" ]] || {
            echo "::error::publish checkout ${ACTUAL_SHA} differs from ${CANDIDATE_SHA}."
            exit 1
          }

      - name: Validate recovered artifact before publication
        if: ${{ inputs.package_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ needs.verify.outputs.recovery_source_run_id }}
          CANDIDATE_SHA: ${{ needs.verify.outputs.candidate_sha }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
          EXPECTED_BUILD: ${{ needs.verify.outputs.build }}
          EXPECTED_TAG: ${{ needs.verify.outputs.tag }}
          EXPECTED_ARTIFACT_ID: ${{ needs.verify.outputs.recovery_artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verify.outputs.recovery_artifact_digest }}
          MANIFEST_PATH: ${{ github.workspace }}/dist/release-package/release-manifest.json
        run: bash release-tools/scripts/validate-release-recovery.sh

      - name: Publish the verified package without rebuilding
        if: ${{ inputs.package_run_id == '' }}
        env:
          MANIFEST_PATH: ${{ github.workspace }}/dist/release-package/release-manifest.json
          PACKAGE_DIR: ${{ github.workspace }}/dist/release-package
        run: bash scripts/publish-release.sh

      - name: Recover publication from the verified source artifact
        if: ${{ inputs.package_run_id != '' }}
        working-directory: release-tools
        env:
          MANIFEST_PATH: ${{ github.workspace }}/dist/release-package/release-manifest.json
          PACKAGE_DIR: ${{ github.workspace }}/dist/release-package
        run: bash scripts/publish-release.sh

      - name: Trigger Gitee mirror sync
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/gitee-sync.yml/dispatches" \
            -f ref=main \
            -f "inputs[tag]=${TAG}" \
            -f "inputs[source_run_id]=${SOURCE_RUN_ID}"; then
            echo "::error::Gitee mirror sync dispatch failed for ${TAG}; GitHub release stays authoritative." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Gitee mirror sync dispatched for ${TAG} (source run ${SOURCE_RUN_ID})." | tee -a "$GITHUB_STEP_SUMMARY"
