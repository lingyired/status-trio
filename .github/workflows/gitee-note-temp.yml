name: Gitee note update temporary
on: workflow_dispatch
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request
          api='https://gitee.com/api/v5/repos/lingyired/status-trio/contents/appcast-gitee.xml'
          def call(method,payload=None):
              req=urllib.request.Request(api,method=method,headers={'Authorization':'Bearer '+os.environ['TOKEN'],'Content-Type':'application/json'},data=json.dumps(payload).encode() if payload else None)
              with urllib.request.urlopen(req,timeout=60) as r: return json.load(r)
          current=call('GET')
          text=base64.b64decode(current['content']).decode()
          for lang,label in [('zh-Hans','更新源：Gitee'),('zh-Hant','更新來源：Gitee')]:
              prefix='<description xml:lang="'+lang+'"><![CDATA['
              marker='<p><strong>'+label+'</strong></p>'
              text=text.replace(prefix+marker,prefix).replace(prefix,prefix+marker)
          call('PUT',{'sha':current['sha'],'branch':'main','message':'标明 Gitee 中文更新日志来源','content':base64.b64encode(text.encode()).decode()})
          print('Updated Chinese source labels')
          PY
