name: Gitee mirror offline checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out mirror tooling
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test mirror scripts without credentials or remote writes
        run: bash scripts/test-gitee-mirror.sh
      - name: Record local Agent sync entry
        run: |
          {
            echo '### Mirror uploads run through the local gitee-release-sync Skill'
            echo 'This workflow runs offline tests only and never uploads a release.'
            echo 'Use node scripts/gitee-mirror-agent.mjs sync <tag> on the local machine.'
          } >> "$GITHUB_STEP_SUMMARY"
