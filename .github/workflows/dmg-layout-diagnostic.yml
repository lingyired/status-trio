name: DMG layout diagnostic

# Temporary, branch-only diagnostic. It builds the real ad-hoc package with the
# styled installer DMG so the headless runner Finder produces the shipped
# layout. No secrets, no notarization, no release publication.
on:
  push:
    branches:
      - fix/244-dmg-ci-layout
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - name: Check out the diagnostic branch
        uses: actions/checkout@v4

      - name: Prepare the DMG installer tool
        run: |
          if ! command -v create-dmg >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install create-dmg
          fi
          create-dmg --version
          bash scripts/create-installer-dmg.sh --check

      - name: Build the styled diagnostic package
        env:
          SPARKLE_PRIVATE_KEY: ''
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          mkdir -p out
          SOURCE_SHA="$SOURCE_SHA" \
          VERSION=1.9.3 BUILD=500 TAG=v1.9.3 \
          PUBLISH_MODE=false NOTARIZE=false \
          UNIVERSAL_BUILD=1 \
          OUTPUT_DIR="$GITHUB_WORKSPACE/out" \
          CODE_SIGN_IDENTITY=- KEYCHAIN_PATH='' NOTARY_PROFILE='' \
          bash scripts/package-release.sh
          ls -la out

      - name: Capture the layout evidence
        run: |
          set -euo pipefail
          DMG="$(ls out/*.dmg | head -n1)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$GITHUB_WORKSPACE/out/vol"
          cp "$GITHUB_WORKSPACE/out/vol/.DS_Store" "$GITHUB_WORKSPACE/out/DS_Store.bin"
          ls -laO "$GITHUB_WORKSPACE/out/vol"
          hdiutil detach "$GITHUB_WORKSPACE/out/vol"

      - name: Upload the diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: dmg-layout-diagnostic
          path: |
            out/*.dmg
            out/*.sha256
            out/DS_Store.bin
            out/release-manifest.json
          retention-days: 3
