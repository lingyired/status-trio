name: DMG layout diagnostic

# Temporary, branch-only diagnostic. It builds the styled installer DMG from the
# app shipped in the latest public release so the real headless runner Finder
# produces the layout. No secrets, no signing, no release publication.
on:
  push:
    branches:
      - fix/244-dmg-ci-layout
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Check out the diagnostic branch
        uses: actions/checkout@v4

      - name: Prepare the DMG installer tool
        run: |
          if ! command -v create-dmg >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install create-dmg
          fi
          create-dmg --version
          bash scripts/create-installer-dmg.sh --check

      - name: Extract the released app bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work out
          gh release download v1.9.2 --repo "$GITHUB_REPOSITORY" --pattern 'StatusTrio-*.dmg' --dir work
          hdiutil attach work/StatusTrio-*.dmg -nobrowse -readonly -mountpoint "$GITHUB_WORKSPACE/work/appvol"
          ditto "$GITHUB_WORKSPACE/work/appvol/Status Trio.app" "$GITHUB_WORKSPACE/work/Status Trio.app"
          hdiutil detach "$GITHUB_WORKSPACE/work/appvol"
          sw_vers

      - name: Build the styled installer DMG
        run: |
          set -euo pipefail
          bash scripts/create-installer-dmg.sh \
            "$GITHUB_WORKSPACE/work/Status Trio.app" \
            "$GITHUB_WORKSPACE/out/StatusTrio-layout-diagnostic.dmg"
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Capture the Finder ds_store
        run: |
          set -euo pipefail
          hdiutil attach "$GITHUB_WORKSPACE/out/StatusTrio-layout-diagnostic.dmg" \
            -nobrowse -readonly -mountpoint "$GITHUB_WORKSPACE/out/vol"
          cp "$GITHUB_WORKSPACE/out/vol/.DS_Store" "$GITHUB_WORKSPACE/out/DS_Store.bin"
          ls -laO "$GITHUB_WORKSPACE/out/vol"
          # Both hidden helpers must carry an Iloc record outside the 660pt
          # window; export the decoded positions for the run log.
          ruby -e '
            data = File.binread(ARGV[0])
            data.scan(/(.{0,40})Ilocblob/) do |prefix|
              text = prefix[0].force_encoding("UTF-16BE").encode("UTF-8", invalid: :replace, undef: :replace)
              name = text[%r{([^\\x00-\\x1f]+)$}, 1]
              offset = prefix[0].bytesize
              puts "Iloc entry: #{name.inspect}"
            end
          ' "$GITHUB_WORKSPACE/out/DS_Store.bin"
          hdiutil detach "$GITHUB_WORKSPACE/out/vol"

      - name: Upload the diagnostic DMG
        uses: actions/upload-artifact@v4
        with:
          name: dmg-layout-diagnostic
          path: |
            out/StatusTrio-layout-diagnostic.dmg
            out/DS_Store.bin
          retention-days: 3
