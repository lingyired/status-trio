<!doctype html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>图标设计器 · 网页交互原型</title>
<style>
@layer reset, tokens, base, components, responsive;
@layer reset {
  *,*::before,*::after{box-sizing:border-box} html{min-width:320px;scroll-behavior:smooth} body,h1,h2,h3,p{margin:0} button,input,select{font:inherit} button{color:inherit} svg{display:block}
}
@layer tokens {
 :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;color-scheme:light dark;--ink:light-dark(oklch(25% .018 255),oklch(92% .012 255));--muted:light-dark(oklch(53% .018 255),oklch(72% .012 255));--faint:light-dark(oklch(68% .012 255),oklch(60% .012 255));--line:color-mix(in oklab,var(--ink) 9%,transparent);--line-strong:color-mix(in oklab,var(--ink) 15%,transparent);--paper:light-dark(oklch(98.5% .004 255),oklch(20% .014 255));--surface:light-dark(#fff,oklch(24% .014 255));--subtle:light-dark(oklch(97% .006 255),oklch(27% .014 255));--well:light-dark(oklch(94.5% .008 255),oklch(17% .014 255));--blue:light-dark(oklch(57% .19 255),oklch(72% .15 255));--blue-soft:color-mix(in oklab,var(--blue) 10%,var(--surface));--green:oklch(64% .15 155);--ring:light-dark(#d1d4da,#51545d);--outer-width:5;--size:1;--accent:#777d86;--accent2:#777d86;--footer:#777d86;--radius:16px;--shadow:0 20px 60px color-mix(in oklab,#263244 10%,transparent);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.45}
 :root[data-theme="light"]{color-scheme:light} :root[data-theme="dark"]{color-scheme:dark} :root[data-theme="system"]{color-scheme:light dark}
}
@layer base {
 body{min-height:100dvh;background:radial-gradient(ellipse at 16% -12%,color-mix(in oklab,var(--blue) 8%,transparent),transparent 36rem),var(--paper);transition:background-color .25s,color .25s}
 button{border:0;background:none;cursor:pointer} button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in oklab,var(--blue) 42%,transparent);outline-offset:2px}
 .shell{width:min(1160px,calc(100% - 48px));margin:auto;padding:30px 0 42px} .topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}.brand{display:flex;align-items:center;gap:12px}.brandmark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 6px #00000008}.brandmark svg{width:21px;color:var(--blue)}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase}.title{font-size:18px;font-weight:650;letter-spacing:-.025em}.top-actions{display:flex;align-items:center;gap:9px}.theme-control{display:flex;gap:2px;padding:3px;background:var(--subtle);border:1px solid var(--line);border-radius:10px}.theme-btn{width:31px;height:29px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}.theme-btn svg{width:15px;height:15px}.theme-btn.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px #00000013}.theme-label{font-size:12px;color:var(--muted);margin-right:3px}
 .intro{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:20px}.intro h1{font-size:clamp(25px,3vw,32px);letter-spacing:-.045em;line-height:1.15;font-weight:650;text-wrap:balance}.intro p{color:var(--muted);margin-top:7px;font-size:13px}.prototype-stamp{display:inline-flex;align-items:center;gap:7px;border:1px solid color-mix(in oklab,var(--blue) 20%,var(--line));background:var(--blue-soft);color:var(--blue);padding:7px 10px;border-radius:999px;font-size:11px;white-space:nowrap}.prototype-stamp svg{width:14px;height:14px}
 .workspace{display:grid;grid-template-columns:minmax(350px,.94fr) minmax(480px,1.06fr);gap:16px;align-items:stretch}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px #00000005}.stage-panel{padding:21px;display:flex;flex-direction:column;min-height:650px}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.panel-title{font-size:15px;font-weight:620;letter-spacing:-.02em}.panel-subtitle{font-size:12px;color:var(--muted);margin-top:3px}.preview-mode{font-size:10px;letter-spacing:.07em;color:oklch(48% .13 150);background:color-mix(in oklab,var(--green) 11%,var(--surface));border:1px solid color-mix(in oklab,var(--green) 24%,transparent);border-radius:999px;padding:5px 8px;white-space:nowrap}
 .stage-well{position:relative;display:grid;place-items:center;min-height:315px;flex:1;margin-top:17px;border-radius:14px;background:radial-gradient(ellipse at center,color-mix(in oklab,var(--blue) 7%,var(--surface)),var(--well) 67%);border:1px solid var(--line);overflow:hidden}.stage-well::before,.stage-well::after{content:"";position:absolute;width:260px;height:260px;border:1px solid color-mix(in oklab,var(--ink) 4%,transparent);border-radius:50%}.stage-well::after{width:205px;height:205px}.stage-stack{position:relative;z-index:1;display:grid;justify-items:center;gap:11px}.hero-icon{width:min(232px,55vw);height:auto;overflow:visible;filter:drop-shadow(0 9px 16px #00000012)}.icon-layer{transform-box:fill-box;transform-origin:center}.glyph-track{fill:none;stroke-linecap:round;stroke-linejoin:round}.ring-track{stroke:var(--ring);stroke-width:var(--outer-width)}.outer-left,.outer-right{stroke:var(--accent);stroke-width:var(--outer-width)}.center-glyph{color:var(--accent2)}.footer-glyph{color:var(--footer)}.glyph-main{stroke:currentColor;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.glyph-fill{fill:currentColor}.glyph-soft{fill:color-mix(in oklab,currentColor 18%,transparent);stroke:currentColor;stroke-width:3}.center-layer{transition:transform .2s ease,opacity .2s ease}.layer-hit{cursor:pointer;pointer-events:all}.layer-hit circle{fill:transparent;stroke:transparent;stroke-width:3}.layer-hit:focus circle{stroke:var(--blue);stroke-dasharray:3 3;outline:none}.layer-hit[data-stage-select="outer"] circle{fill:none;pointer-events:stroke}.center-layer.depart{transform:translateX(-17px);opacity:0}.center-layer.arrive{animation:slide-in .2s ease both}@keyframes slide-in{from{transform:translateX(17px);opacity:0}to{transform:translateX(0);opacity:1}}
 .hero-caption{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.01em}.preview-strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.mini-card{background:var(--subtle);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:11px;min-width:0}.mini-label{font-size:11px;color:var(--muted)}.mini-hint{font-size:10px;color:var(--faint);margin-top:2px}.menubar-preview{width:43px;height:27px;border-radius:7px;background:light-dark(#303136,#f1f2f4);display:grid;place-items:center;flex:none}.menubar-preview svg{width:25px;height:20px}.dock-preview{height:34px;width:47px;display:grid;place-items:center;flex:none}.dock-preview svg{width:31px;height:31px;filter:drop-shadow(0 2px 2px #0003)}.scenario-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.scenario-title{font-size:11px;color:var(--muted)}.scenario-select{max-width:58%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:11px;padding:7px 28px 7px 9px;border-radius:8px}.scenario-note{margin-top:9px;font-size:10px;line-height:1.5;color:var(--muted);display:flex;gap:6px}.scenario-note svg{width:13px;height:13px;flex:none;margin-top:1px;color:var(--blue)}
 .editor{padding:0;overflow:hidden;min-height:650px}.tabbar{display:flex;gap:3px;padding:15px 18px 0;border-bottom:1px solid var(--line)}.tab{position:relative;padding:7px 13px 12px;color:var(--muted);font-size:13px;font-weight:560}.tab:hover{color:var(--ink)}.tab.active{color:var(--blue)}.tab.active::after{content:"";position:absolute;bottom:-1px;left:11px;right:11px;height:2px;border-radius:2px;background:var(--blue)}.tab svg{display:none}.editor-content{padding:19px 21px 14px}.section-heading{font-size:12px;font-weight:650;margin-bottom:3px}.section-description{font-size:11px;color:var(--muted);margin-bottom:12px}.source-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.source-card{position:relative;min-height:69px;text-align:left;padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--surface);transition:border-color .16s,background .16s,transform .16s}.source-card:hover{border-color:var(--line-strong);transform:translateY(-1px)}.source-card.selected{border-color:color-mix(in oklab,var(--blue) 54%,var(--line));background:var(--blue-soft)}.source-card.selected::after{content:"";position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px color-mix(in oklab,var(--blue) 13%,transparent)}.source-icon{height:19px;color:var(--muted);margin-bottom:6px}.source-icon svg{width:19px;height:19px}.source-card.selected .source-icon{color:var(--blue)}.source-name{display:block;font-size:11px;font-weight:580;line-height:1.35}.source-meta{display:block;font-size:9px;color:var(--muted);margin-top:3px;line-height:1.3}.subsection{border-top:1px solid var(--line);margin-top:15px;padding-top:14px}.line-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}.toggle-copy strong{display:block;font-size:11px;font-weight:570}.toggle-copy small{display:block;font-size:10px;color:var(--muted);margin-top:2px}.switch{position:relative;width:34px;height:20px;border-radius:99px;background:color-mix(in oklab,var(--ink) 19%,transparent);padding:2px;flex:none;transition:background .18s}.switch::after{content:"";display:block;width:16px;height:16px;border-radius:50%;background:white;box-shadow:0 1px 2px #0003;transition:transform .18s}.switch[aria-checked="true"]{background:var(--blue)}.switch[aria-checked="true"]::after{transform:translateX(14px)}.range-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:8px 0}.range-label{font-size:11px}.range-value{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}.range-row input[type=range]{grid-column:1/-1;width:100%;margin:0;accent-color:var(--blue);height:16px}.color-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;gap:10px}.color-label{font-size:11px}.color-input{width:27px;height:24px;border:0;background:none;padding:0;cursor:pointer}.color-input::-webkit-color-swatch-wrapper{padding:2px}.color-input::-webkit-color-swatch{border:1px solid var(--line-strong);border-radius:7px}.preset-row{display:flex;gap:7px;flex-wrap:wrap}.preset{border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:10px;color:var(--muted);background:var(--surface)}.preset:hover,.preset.active{border-color:color-mix(in oklab,var(--blue) 45%,var(--line));color:var(--blue);background:var(--blue-soft)}.info-note{display:flex;gap:7px;padding:9px 10px;background:var(--subtle);border-radius:9px;color:var(--muted);font-size:10px;line-height:1.45;margin-top:10px}.info-note svg{width:14px;height:14px;flex:none;color:var(--blue)}.fallback-callout{border:1px solid color-mix(in oklab,oklch(72% .14 78) 35%,var(--line));background:color-mix(in oklab,oklch(91% .05 86) 48%,var(--surface));color:light-dark(oklch(40% .075 75),oklch(84% .08 80));padding:10px;border-radius:10px;font-size:10px;line-height:1.5;margin-top:11px}.fallback-callout b{font-weight:650}.empty-panel{border:1px dashed var(--line-strong);padding:15px;border-radius:11px;color:var(--muted);font-size:11px;background:var(--subtle)}.empty-panel strong{display:block;color:var(--ink);font-weight:590;margin-bottom:4px}
 .editor-footer{margin-top:auto;border-top:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:color-mix(in oklab,var(--subtle) 55%,var(--surface))}.history-label{font-size:10px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.footer-actions{display:flex;gap:7px;flex:none}.button{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 10px;border-radius:8px;font-size:10px;font-weight:560;border:1px solid var(--line);background:var(--surface);transition:background .16s,border .16s}.button:hover{background:var(--subtle);border-color:var(--line-strong)}.button svg{width:13px;height:13px}.button:disabled{opacity:.4;cursor:not-allowed}.button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.button.primary:hover{filter:brightness(1.05)}.button.text{border-color:transparent;background:transparent;color:var(--muted)}.button.text:hover{color:var(--ink);background:var(--subtle)}
 .more-wrap{position:relative}.more-menu{position:absolute;right:0;bottom:calc(100% + 8px);z-index:5;min-width:190px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.menu-action{width:100%;text-align:left;padding:9px;border-radius:7px;font-size:11px}.menu-action:hover{background:var(--subtle)}
 .dialog-backdrop{position:fixed;inset:0;z-index:10;background:#11182755;display:grid;place-items:center;padding:18px;backdrop-filter:blur(5px)}.dialog{width:min(420px,100%);border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);padding:22px}.dialog h2{font-size:17px;letter-spacing:-.02em}.dialog p{font-size:12px;color:var(--muted);line-height:1.6;margin:9px 0 18px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:light-dark(#272a30,#f5f6f8);color:light-dark(#fff,#202228);padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:11px;transition:opacity .2s,transform .2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
}
@layer components {
 .preview-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.preview-toolbar .scenario-title{margin-right:auto}.mode-label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}.preview-toolbar .scenario-select{max-width:260px}.sample-panel{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--subtle);display:grid;gap:10px}.sample-panel.hidden{display:none}.sample-head{display:grid;gap:2px}.sample-head span,.sample-group .source-meta{color:var(--muted);font-size:11px}.sample-group{display:grid;gap:7px;padding-top:8px;border-top:1px solid var(--line)}.sample-check{display:flex;align-items:center;gap:7px;font-size:12px}.sample-check input{accent-color:var(--blue)}
 .center-layer.depart{opacity:.3;transform:scale(.96)}.center-layer.arrive{animation:center-arrive .2s ease-out}@keyframes center-arrive{from{opacity:.35;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
}
@layer responsive {
 @media(max-width:900px){.workspace{grid-template-columns:minmax(300px,.85fr) minmax(400px,1.15fr)}.stage-panel{padding:17px}.editor-content{padding:17px}.source-grid{gap:6px}.source-card{padding:8px}}
 @media(max-width:760px){.shell{width:min(620px,calc(100% - 28px));padding-top:18px}.intro{align-items:flex-start;flex-direction:column;gap:12px}.workspace{grid-template-columns:1fr}.stage-panel,.editor{min-height:0}.stage-well{min-height:280px;flex:none}.stage-panel{padding:16px}.editor-content{min-height:350px}.hero-icon{width:min(210px,55vw)}}
 @media(max-width:440px){.topline{align-items:flex-start}.theme-label{display:none}.top-actions{gap:4px}.intro h1{font-size:26px}.source-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.preview-strip{gap:7px}.mini-card{padding:9px}.menubar-preview{width:38px}.tabbar{padding-inline:11px}.tab{padding-inline:10px}.editor-content{padding:15px}.editor-footer{padding:10px 12px}.button{padding:7px 8px}}
 @media(pointer:coarse){button{min-height:40px}.theme-btn{min-height:34px}.switch{min-height:20px}}
 @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
}
</style>
</head>
<body>
<div class="shell">
<header class="topline">
 <div class="brand"><span class="brandmark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5c4.7 0 8.5 3.8 8.5 8.5s-3.8 8.5-8.5 8.5S3.5 16.7 3.5 12 7.3 3.5 12 3.5Z" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.2v4.9l3.2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span><span class="eyebrow">STATUS TRIO · CONCEPT</span><span class="title" style="display:block">图标设计器</span></span></div>
 <div class="top-actions"><span class="theme-label">界面外观</span><div class="theme-control" role="group" aria-label="原型界面主题"><button class="theme-btn" data-theme="system" aria-label="跟随系统" title="跟随系统"><svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="3" width="15" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 17h6M10 14v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button><button class="theme-btn active" data-theme="light" aria-label="浅色"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="3.2" stroke="currentColor" stroke-width="1.5"/><path d="M10 2v2m0 12v2M2 10h2m12 0h2M4.35 4.35l1.42 1.42m8.46 8.46 1.42 1.42m0-11.3-1.42 1.42m-8.46 8.46-1.42 1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button><button class="theme-btn" data-theme="dark" aria-label="深色"><svg viewBox="0 0 20 20" fill="none"><path d="M16.7 12.2A7 7 0 0 1 7.8 3.3a7 7 0 1 0 8.9 8.9Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button></div></div>
</header>
<div class="intro"><div><h1>为每一层图标，找到恰好的表达。</h1><p>组合外环、中间状态与底部音量；所有变化仅作用于此原型预览。</p></div><div class="prototype-stamp"><svg viewBox="0 0 20 20" fill="none"><path d="M10 2.5 17 6v4.8c0 3.2-2.2 5.3-7 6.7-4.8-1.4-7-3.5-7-6.7V6l7-3.5Z" stroke="currentColor" stroke-width="1.5"/><path d="m7 10 2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>网页交互原型 · 非原生 App，图标为示意</div></div>
<main class="workspace">
<section class="panel stage-panel" aria-label="图标实时预览">
 <div class="panel-head"><div><h2 class="panel-title">实时预览</h2><p class="panel-subtitle">三种尺寸同步呈现</p></div><span class="preview-mode">SIMULATED · 模拟数据</span></div>
 <div class="stage-well"><div class="stage-stack">
  <svg class="hero-icon" id="heroSvg" viewBox="0 0 200 200" role="group" aria-label="组合状态图标示意">
   <g id="outerLayer" class="icon-layer"></g>
   <g id="centerLayer" class="icon-layer center-layer"><g id="centerGlyph" class="center-glyph"></g></g>
   <g id="footerLayer" class="icon-layer footer-glyph"></g>
   <g class="layer-hit" data-stage-select="outer" role="button" tabindex="0" aria-label="选择外环设置"><circle cx="100" cy="100" r="90" fill="none" stroke="transparent" stroke-width="5" pointer-events="stroke"/></g>
   <g class="layer-hit" data-stage-select="center" role="button" tabindex="0" aria-label="选择中间图标设置"><circle cx="100" cy="82" r="31"/></g>
   <g class="layer-hit" data-stage-select="footer" role="button" tabindex="0" aria-label="选择底部设置"><circle cx="100" cy="137" r="18"/></g>
  </svg>
  <div class="hero-caption">主图标 · 组合效果示意</div>
 </div></div>
 <div class="preview-strip">
  <div class="mini-card"><div class="menubar-preview"><svg id="menuSvg" viewBox="0 0 200 200" aria-label="菜单栏图标示意"></svg></div><div><div class="mini-label">菜单栏</div><div class="mini-hint">尺寸缩略 · 组合复用</div></div></div>
  <div class="mini-card"><div class="dock-preview"><svg id="dockSvg" viewBox="0 0 200 200" aria-label="Dock 图标示意"></svg></div><div><div class="mini-label">Dock</div><div class="mini-hint">应用图标示意</div></div></div>
 </div>

 function sampleSources(){const used=new Set();for(const slot of ['outer','center','footer']){const src=config[slot].source,fb=config[slot].fallback;if(src==='battery'||src==='percentage'||fb==='battery'||fb==='percentage')used.add('macBattery');if(src==='airpods'||fb==='airpods'||(src==='bluetooth'&&config.center.device==='airpods'))used.add('airpods');if(src==='wifi'||fb==='wifi')used.add('network');if(src==='bluetooth'||fb==='bluetooth')used.add('bluetooth');if(src==='volume'||fb==='volume'||(slot==='center'&&isAudioTarget()&&config.center.audioUsesVolumeColor))used.add('volume');}return used}
 function renderSamples(){const panel=$('#samplePanel'),used=sampleSources();panel.classList.toggle('hidden',!samplesOpen);$('#editSamples').setAttribute('aria-expanded',String(samplesOpen));if(!samplesOpen)return;let h='<div class="sample-head"><strong>模拟数据 · 不计入撤销</strong><span>仅展示当前来源与回退会用到的数据</span></div>';if(used.has('macBattery'))h+=`<section class="sample-group"><strong>Mac 电池（共享样例）</strong>${slider('电量','sample.macBattery.value',samples.macBattery.value,0,100)}<label class="sample-check"><input type="checkbox" data-sample="macBattery.charging" ${samples.macBattery.charging?'checked':''}> 正在充电（模拟）</label><span class="source-meta">仅作为样例说明，不覆盖中间图标。</span></section>`;if(used.has('airpods'))h+=`<section class="sample-group"><strong>AirPods（模拟）</strong><div class="preset-row"><button class="preset" data-sample-preset="both">双耳在线</button><button class="preset" data-sample-preset="left">仅左耳</button><button class="preset" data-sample-preset="right">仅右耳</button><button class="preset" data-sample-preset="none">均不可用</button></div>${toggle('左耳可用','不可用时由另一耳镜像',samples.airpods.leftAvailable,'sample.airpods.leftAvailable')}${samples.airpods.leftAvailable?slider('左耳电量','sample.airpods.left',samples.airpods.left,0,100):''}${toggle('右耳可用','不可用时由另一耳镜像',samples.airpods.rightAvailable,'sample.airpods.rightAvailable')}${samples.airpods.rightAvailable?slider('右耳电量','sample.airpods.right',samples.airpods.right,0,100):''}</section>`;if(used.has('network'))h+=`<section class="sample-group"><strong>网络情景</strong><span class="source-meta">由上方场景选择器控制；不会访问真实网络。</span></section>`;if(used.has('bluetooth'))h+=`<section class="sample-group"><strong>蓝牙在线设备（模拟）</strong><span class="source-meta">AirPods（模拟）、扬声器（模拟）、键盘（模拟）、鼠标（模拟）；目标选择不会连接设备。</span></section>`;if(used.has('volume'))h+=`<section class="sample-group"><strong>音量（共享样例）</strong>${slider('音量','sample.volume.value',samples.volume.value,0,100)}<label class="sample-check"><input type="checkbox" data-sample="volume.muted" ${samples.volume.muted?'checked':''}> 静音（模拟）</label></section>`;panel.innerHTML=h;panel.querySelectorAll('[data-range^="sample."]').forEach(el=>el.addEventListener('input',()=>{const [,group,key]=el.dataset.range.split('.');samples[group][key]=Number(el.value);el.previousElementSibling.textContent=el.value+'%';renderPreview()}));panel.querySelectorAll('[data-toggle^="sample."]').forEach(el=>el.addEventListener('click',()=>{const [,group,key]=el.dataset.toggle.split('.');samples[group][key]=!samples[group][key];renderSamples();renderPreview()}));panel.querySelectorAll('[data-sample]').forEach(el=>el.addEventListener('change',()=>{const [group,key]=el.dataset.sample.split('.');samples[group][key]=el.checked;renderPreview()}));panel.querySelectorAll('[data-sample-preset]').forEach(el=>el.addEventListener('click',()=>{const p=el.dataset.samplePreset;samples.airpods.leftAvailable=p==='both'||p==='left';samples.airpods.rightAvailable=p==='both'||p==='right';renderSamples();renderPreview()}))}

 function openReset(scope){pendingReset=scope;$('#dialogTitle').textContent=scope==='all'?'恢复全部原型默认？':`重置“${tab==='outer'?'外环':tab==='center'?'中间':'底部'}”这一层？`;$('#dialogCopy').textContent=scope==='all'?'将三层配置恢复为原型起始示例；可撤销，不代表产品正式默认组合。':'只将当前层恢复为原型起始示例；操作可撤销，不影响其他层。';$('#confirmReset').textContent=scope==='all'?'恢复全部原型默认':'重置此层';$('#confirmBackdrop').classList.remove('hidden')}
